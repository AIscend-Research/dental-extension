# Project config. Paths are relative to repo root.
# Load this in your scripts; do not hardcode paths in modules.

data:
  # where scripts/download_dentex.py puts the DENTEX data
  dentex_root: data/dentex
  # Real layout confirmed after download (differs from the HF page's
  # top-level docs): scripts/download_dentex.py lands three zips
  # (training_data.zip, validation_data.zip, test_data.zip) plus a top-level
  # validation_triple.json. Only "quadrant-enumeration-disease" carries
  # diagnosis labels, and its json uses category_id_3 / categories_3
  # (multi-task schema), not a flat "categories" / "category_id" -- see
  # src/data/dentex.py:class_balance. Unzip the relevant subfolder(s) before
  # pointing here:
  #   unzip "training_data/quadrant-enumeration-disease/*" \
  #     data/dentex/DENTEX/training_data.zip -d data/dentex/DENTEX/
  #   unzip data/dentex/DENTEX/validation_data.zip -d data/dentex/DENTEX/
  coco_annotations: data/dentex/DENTEX/training_data/quadrant-enumeration-disease/train_quadrant_enumeration_disease.json
  image_root: data/dentex/DENTEX/training_data/quadrant-enumeration-disease/xrays
  # validation ground truth ships separately (top-level, released after the
  # challenge closed) -- same category_id_3/categories_3 schema as train.
  val_annotations: data/dentex/DENTEX/validation_triple.json
  val_image_root: data/dentex/DENTEX/validation_data/quadrant_enumeration_disease/xrays
  split:
    # NOTE: DENTEX ships no patient id (see src/data/dentex.py:_patient_key) --
    # this is an image-level split, not a verified patient-level one. State
    # that as a limitation rather than assuming patient safety.
    val_frac: 0.15
    test_frac: 0.15
    seed: 0

degradation:
  # severity range each applied degradation draws from
  severity_range: [0.3, 0.9]
  max_simultaneous: 3
  # set for reproducible augmented datasets; null = fresh randomness
  seed: null

model:
  # which task setup: "caries_only" collapses diagnosis to caries vs bg,
  # "diagnosis" keeps all four DENTEX diagnosis classes.
  # CURRENTLY "diagnosis" because that is what actually runs: the caries_only
  # collapse is NOT wired up yet (src/models/detector.py is still a stub, and
  # kaggle/01 trains all four classes). Flip this to caries_only only when the
  # collapse actually exists end to end -- see TASKS.md Phase 3.
  task: diagnosis
  baseline_config: external/HierarchicalDet/configs/diffdet.custom.swinbase.nonpretrain.yaml
  # Swin-LARGE, not Base. The upstream config's own MODEL.WEIGHTS names
  # swin_base_patch4_window7_224_22k.pkl while setting MODEL.SWIN.SIZE: L-22k
  # -- loading the Base file "succeeds" with zero errors and silently leaves
  # ~90% of the backbone randomly initialized. SETUP.md has the download +
  # convert recipe for the correct file.
  backbone_weights: models_weights/swin_large_patch4_window7_224_22k.pkl

confidence:
  # placeholder operating points -- TUNE these in Phase 4 with safe_deferral_rate
  retake_below: 0.4
  refer_below: 0.7

eval:
  target_accuracy: 0.95   # for the safe-deferral-rate headline number

seed: 0
