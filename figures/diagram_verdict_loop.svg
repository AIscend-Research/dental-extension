<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d1451b"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="600" y="40" text-anchor="middle" font-size="25" fill="#1a1a1a">The verdict loop, and what each standard of proof costs</text>
  <text x="600" y="68" text-anchor="middle" font-size="14.5" fill="#6b6b6b">A screening model has three moves, not one: decide the case, demand better evidence, or hand it to a human.</text>

  <!-- ============ left: the loop ============ -->
  <rect x="34" y="96" width="676" height="576" rx="10" fill="#fcfcfd" stroke="#e3e3e6" stroke-width="1.4"/>

  <!-- capture -->
  <rect x="78" y="130" width="180" height="62" rx="8" fill="#f4f4f6" stroke="#1a1a1a" stroke-width="1.7"/>
  <text x="168" y="158" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">take a photograph</text>
  <text x="168" y="178" text-anchor="middle" font-size="12" fill="#6b6b6b">budget: K captures</text>

  <path d="M 258 161 L 336 161" stroke="#4a4a4a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- read -->
  <rect x="340" y="130" width="212" height="62" rx="8" fill="#eaf1fd" stroke="#1f6feb" stroke-width="1.7"/>
  <text x="446" y="155" text-anchor="middle" font-size="14" fill="#1f6feb" font-weight="bold">read both channels</text>
  <text x="446" y="176" text-anchor="middle" font-size="12" fill="#20324a">quality first, then diagnosis</text>

  <path d="M 446 192 L 446 226" stroke="#4a4a4a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- wealth -->
  <rect x="316" y="230" width="260" height="76" rx="8" fill="#f4f4f6" stroke="#1a1a1a" stroke-width="1.7"/>
  <text x="446" y="254" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">update two wealth processes</text>
  <text x="446" y="276" text-anchor="middle" font-size="12.5" fill="#d1451b">against "sound" : convict</text>
  <text x="446" y="295" text-anchor="middle" font-size="12.5" fill="#1a7f37">against "carious" : discharge</text>

  <path d="M 446 306 L 446 338" stroke="#4a4a4a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- decision diamond -->
  <path d="M 446 342 L 570 400 L 446 458 L 322 400 z" fill="#fff8e6" stroke="#b8860b" stroke-width="1.8"/>
  <text x="446" y="392" text-anchor="middle" font-size="13.5" fill="#7a5a06" font-weight="bold">has either burden</text>
  <text x="446" y="411" text-anchor="middle" font-size="13.5" fill="#7a5a06" font-weight="bold">ever been met?</text>
  <text x="446" y="431" text-anchor="middle" font-size="10.5" fill="#9a7a26">running maximum, not current</text>

  <!-- convict branch (right) -->
  <path d="M 570 400 L 588 400" stroke="#d1451b" stroke-width="2" fill="none" marker-end="url(#aR)"/>
  <rect x="592" y="370" width="114" height="60" rx="8" fill="#fdeeea" stroke="#d1451b" stroke-width="1.8"/>
  <text x="649" y="394" text-anchor="middle" font-size="13" fill="#d1451b" font-weight="bold">VERDICT</text>
  <text x="649" y="410" text-anchor="middle" font-size="13" fill="#d1451b" font-weight="bold">caries</text>
  <text x="649" y="424" text-anchor="middle" font-size="10.5" fill="#8a5545">refer for treatment</text>

  <!-- discharge branch (left) -->
  <path d="M 322 400 L 262 400" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#aG)"/>
  <rect x="140" y="370" width="118" height="60" rx="8" fill="#eaf6ec" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="199" y="394" text-anchor="middle" font-size="13" fill="#1a7f37" font-weight="bold">VERDICT</text>
  <text x="199" y="410" text-anchor="middle" font-size="13" fill="#1a7f37" font-weight="bold">sound</text>
  <text x="199" y="424" text-anchor="middle" font-size="10.5" fill="#1d4a2b">send home untreated</text>

  <!-- neither -->
  <path d="M 446 458 L 446 492" stroke="#4a4a4a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="460" y="481" font-size="12" fill="#6b6b6b">neither</text>

  <path d="M 446 496 L 556 542 L 446 588 L 336 542 z" fill="#fff8e6" stroke="#b8860b" stroke-width="1.8"/>
  <text x="446" y="538" text-anchor="middle" font-size="13.5" fill="#7a5a06" font-weight="bold">captures left?</text>
  <text x="446" y="558" text-anchor="middle" font-size="10.5" fill="#9a7a26">and is the fault fixable?</text>

  <!-- subpoena, and the loop back to capture -->
  <path d="M 336 542 L 286 542" stroke="#1f6feb" stroke-width="2.2" fill="none" marker-end="url(#aB)"/>
  <rect x="86" y="508" width="196" height="76" rx="8" fill="#eaf1fd" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="184" y="532" text-anchor="middle" font-size="13.5" fill="#1f6feb" font-weight="bold">SUBPOENA</text>
  <text x="184" y="552" text-anchor="middle" font-size="11.5" fill="#20324a">"too much reflection &#8212;</text>
  <text x="184" y="568" text-anchor="middle" font-size="11.5" fill="#20324a">turn the film and retake"</text>
  <path d="M 86 546 L 56 546 L 56 161 L 74 161" stroke="#1f6feb" stroke-width="2.2" fill="none" marker-end="url(#aB)"/>
  <text x="184" y="602" text-anchor="middle" font-size="10.5" fill="#1f6feb" font-style="italic">names the fault, from the quality channel only</text>

  <!-- escalate -->
  <path d="M 556 542 L 596 542 L 596 594" stroke="#6b6b6b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="522" y="598" width="152" height="54" rx="8" fill="#f2f2f4" stroke="#6b6b6b" stroke-width="1.8"/>
  <text x="598" y="621" text-anchor="middle" font-size="13.5" fill="#4a4a4a" font-weight="bold">ESCALATE</text>
  <text x="598" y="640" text-anchor="middle" font-size="11.5" fill="#6b6b6b">a clinician decides</text>

  <text x="290" y="634" text-anchor="middle" font-size="11.5" fill="#6b6b6b">Escalating is a correct outcome, not a failure &#8212; but it</text>
  <text x="290" y="651" text-anchor="middle" font-size="11.5" fill="#6b6b6b">spends captures without earning a verdict.</text>

  <!-- ============ right: the ladder ============ -->
  <rect x="726" y="96" width="440" height="576" rx="10" fill="#fcfcfd" stroke="#e3e3e6" stroke-width="1.4"/>
  <text x="946" y="128" text-anchor="middle" font-size="17" fill="#1a1a1a" font-weight="bold">The standards ladder</text>
  <text x="946" y="150" text-anchor="middle" font-size="12" fill="#6b6b6b">threshold = 1/&#945;, straight from Ville's inequality</text>
  <text x="946" y="170" text-anchor="middle" font-size="11.5" fill="#9aa0a6">measured on The Docket: 2000 cases, K = 4, clinic AUC 0.78</text>

  <!-- header -->
  <text x="752" y="204" font-size="11.5" fill="#6b6b6b" font-weight="bold">standard</text>
  <text x="1012" y="204" font-size="11.5" fill="#6b6b6b" font-weight="bold">bar</text>
  <text x="1064" y="204" font-size="11.5" fill="#6b6b6b" font-weight="bold">decided / escalated</text>
  <line x1="748" y1="212" x2="1146" y2="212" stroke="#dcdcdc" stroke-width="1.2"/>

  <!-- rung 1 -->
  <text x="752" y="243" font-size="13.5" fill="#1a1a1a">preponderance</text>
  <text x="752" y="261" font-size="11" fill="#9aa0a6">more likely than not</text>
  <text x="1012" y="245" font-size="13" fill="#1a1a1a" font-weight="bold">2&#215;</text>
  <rect x="1052" y="230" width="94" height="18" rx="3" fill="#e6e6e9"/>
  <rect x="1052" y="230" width="80" height="18" rx="3" fill="#1f6feb"/>
  <text x="1052" y="264" font-size="11.5" fill="#1f6feb">85% decided</text>

  <!-- rung 2 -->
  <text x="752" y="313" font-size="13.5" fill="#1a1a1a">clear and convincing</text>
  <text x="752" y="331" font-size="11" fill="#9aa0a6">substantially more probable</text>
  <text x="1012" y="315" font-size="13" fill="#1a1a1a" font-weight="bold">5&#215;</text>
  <rect x="1052" y="300" width="94" height="18" rx="3" fill="#e6e6e9"/>
  <rect x="1052" y="300" width="45" height="18" rx="3" fill="#1f6feb"/>
  <text x="1052" y="334" font-size="11.5" fill="#1f6feb">48% decided</text>

  <!-- rung 3 -->
  <text x="752" y="383" font-size="13.5" fill="#1a1a1a">beyond reasonable doubt</text>
  <text x="752" y="401" font-size="11" fill="#9aa0a6">the criminal standard</text>
  <text x="1012" y="385" font-size="13" fill="#1a1a1a" font-weight="bold">20&#215;</text>
  <rect x="1052" y="370" width="94" height="18" rx="3" fill="#e6e6e9"/>
  <rect x="1052" y="370" width="12" height="18" rx="3" fill="#1f6feb"/>
  <text x="1052" y="404" font-size="11.5" fill="#1f6feb">13% decided</text>

  <!-- rung 4 -->
  <text x="752" y="453" font-size="13.5" fill="#1a1a1a">near certainty</text>
  <text x="752" y="471" font-size="11" fill="#9aa0a6">stricter than any legal standard</text>
  <text x="1012" y="455" font-size="13" fill="#1a1a1a" font-weight="bold">100&#215;</text>
  <rect x="1052" y="440" width="94" height="18" rx="3" fill="#e6e6e9"/>
  <rect x="1052" y="440" width="2" height="18" rx="1" fill="#1f6feb"/>
  <text x="1052" y="474" font-size="11.5" fill="#1f6feb">1% decided</text>

  <line x1="748" y1="498" x2="1146" y2="498" stroke="#dcdcdc" stroke-width="1.2"/>

  <!-- the asymmetry note -->
  <rect x="748" y="514" width="398" height="66" rx="7" fill="#fff8e6" stroke="#e0c88a" stroke-width="1.3"/>
  <text x="766" y="537" font-size="12.5" fill="#7a5a06" font-weight="bold">The two sides carry different burdens.</text>
  <text x="766" y="556" font-size="12" fill="#7a5a06">Convicting means "refer for treatment". Discharging sends</text>
  <text x="766" y="572" font-size="12" fill="#7a5a06">someone home untreated, so it is held to the higher bar.</text>

  <text x="748" y="606" font-size="12.5" fill="#4a4a4a" font-weight="bold">The number a deployment decision starts from:</text>
  <text x="748" y="628" font-size="12.5" fill="#4a4a4a">at a criminal standard of proof, a phone-grade reader can settle</text>
  <text x="748" y="646" font-size="12.5" fill="#4a4a4a">only 13% of cases within four photographs. That is a property of</text>
  <text x="748" y="664" font-size="12.5" fill="#4a4a4a">the reader and the room, not of the capture policy.</text>
</svg>
